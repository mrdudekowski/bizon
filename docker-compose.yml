services:
  postgres:
    image: postgres:16-alpine
    container_name: bizon-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizon
    volumes:
      - bizon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-app
    container_name: bizon-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bizon
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bizon_pg_data:
