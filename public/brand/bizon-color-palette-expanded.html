<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#232323" />
  <title>BIZON — расширенная цветовая палитра</title>
  <style>
    :root{--bg:#232323;--surface:#2c2c2c;--line:rgba(255,255,255,.09);--text:#f7f7f7;--muted:#aaa7a4;--shadow:0 12px 30px rgba(0,0,0,.25);--radius:8px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit}.page{width:min(1540px,calc(100% - 40px));margin:0 auto;padding:34px 0 70px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#E45433 0 48%,#06E3BE 48% 72%,#363636 72%);box-shadow:var(--shadow)}.brand h1{margin:0;font-size:clamp(28px,4vw,48px);line-height:1;letter-spacing:-.04em;text-transform:uppercase}.brand p{margin:7px 0 0;color:var(--muted);font-size:14px}.copy-format{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.copy-format select{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 36px 10px 12px;outline:none;cursor:pointer}.palette-family{margin-top:52px}.family-head{display:flex;align-items:center;gap:13px;margin-bottom:26px}.family-dot{width:12px;height:12px;border-radius:50%;background:var(--family)}.family-head h2{margin:0;font-size:24px;letter-spacing:-.025em}.family-head span{color:var(--muted);font-size:14px}.palette-section{margin-top:34px}.section-copy{margin-bottom:20px}.section-copy h3{margin:0 0 7px;font-size:22px;letter-spacing:-.02em}.section-copy p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}.swatch-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 34px}.swatch-grid.six{grid-template-columns:repeat(6,minmax(0,1fr))}.swatch{position:relative;min-height:112px;border:0;border-radius:var(--radius);background:var(--color);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;overflow:hidden}.swatch:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,0,0,.34);filter:brightness(1.03)}.swatch:focus-visible{outline:3px solid #fff;outline-offset:4px}.swatch-inner{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px;text-align:center}.tone{font-size:15px;font-weight:800}.hex{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:800}.recommended{position:absolute;top:12px;left:12px;font-size:19px}.copy-label{position:absolute;right:10px;bottom:10px;padding:7px 9px;border-radius:999px;background:rgba(0,0,0,.48);color:#fff;font-size:10px;font-weight:800;opacity:0;transform:translateY(4px);transition:.18s ease}.swatch:hover .copy-label{opacity:1;transform:translateY(0)}.divider{margin-top:52px;border:0;border-top:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:26px;z-index:20;display:flex;align-items:center;gap:10px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:13px 17px;border:1px solid var(--line);border-radius:999px;background:rgba(35,35,35,.94);box-shadow:0 18px 44px rgba(0,0,0,.36);transition:.2s ease;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.toast-dot{width:9px;height:9px;border-radius:50%;background:var(--toast-color,#E45433)}.toast code{color:#fff;font-weight:800}@media(max-width:1100px){.swatch-grid,.swatch-grid.six{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.page{width:min(100% - 24px,1540px)}.topbar{align-items:flex-start;flex-direction:column}.copy-format{width:100%;justify-content:space-between}.swatch-grid,.swatch-grid.six{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.palette-family{margin-top:42px}}@media(max-width:440px){.swatch-grid,.swatch-grid.six{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="page">
<header class="topbar"><div class="brand"><div class="brand-mark"></div><div><h1>BIZON Palette</h1><p>Интерактивная палитра фирменных оттенков</p></div></div><label class="copy-format">Копировать как<select id="copyFormat"><option value="hex">HEX</option><option value="rgb">RGB</option><option value="variable">CSS variable</option></select></label></header>
<div id="paletteRoot"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-dot" id="toastDot"></span>Скопировано: <code id="toastValue"></code></div>
<script>
const paletteFamilies=[
{id:'coral',name:'BIZON Coral',description:'Энергия, действие, акцентные элементы и рекламные коммуникации.',familyColor:'#E45433',sections:[
{title:'Основные оттенки',description:'10 основных оттенков цвета по шкале яркости от 50 до 900. Шкалу используют при создании дизайн-макетов и фирменного стиля.',columns:5,colors:[['50','#FFFEFE'],['100','#FCEBE7'],['200','#F6C5BA'],['300','#F0A08D'],['400','#EA7A60'],['500','#E45433',true],['600','#C93B1B'],['700','#9C2E15'],['800','#6F210F'],['900','#421309']]},
{title:'Светлые оттенки',description:'Создаются добавлением белого цвета к базовому цвету. Оттенки становятся пастельными.',columns:6,colors:[['','#E45433'],['','#F07959'],['','#FA9B81'],['','#FFBCA9'],['','#FFDED4'],['','#FFFFFF']]},
{title:'Серые оттенки',description:'Создаются добавлением серого к базовому цвету. Оттенки выглядят сложнее базового цвета.',columns:6,colors:[['','#E45433'],['','#D46043'],['','#C26A53'],['','#AF7362'],['','#997A71'],['','#808080']]},
{title:'Тёмные оттенки',description:'Создаются добавлением чёрного цвета к базовому. Оттенки выглядят насыщеннее.',columns:6,colors:[['','#E45433'],['','#B3442A'],['','#843522'],['','#582619'],['','#2F1710'],['','#000000']]}]},
{id:'mint',name:'BIZON Mint',description:'Цифровые интерфейсы, технологии, свежие акценты и системные статусы.',familyColor:'#06E3BE',sections:[
{title:'Основные оттенки',description:'10 основных оттенков цвета по шкале яркости от 50 до 900.',columns:5,colors:[['50','#D1FEF6'],['100','#B8FDF2'],['200','#86FCE8'],['300','#55FADF'],['400','#23F9D5'],['500','#06E3BE',true],['600','#05B194'],['700','#03806B'],['800','#024E41'],['900','#011C18']]},
{title:'Светлые оттенки',description:'Пастельные оттенки для мягких фонов, подсветки и спокойных состояний.',columns:6,colors:[['','#06E3BE'],['','#67EACB'],['','#95F0D8'],['','#BBF5E5'],['','#DEFAF2'],['','#FFFFFF']]},
{title:'Серые оттенки',description:'Приглушённые оттенки для сложных интерфейсных сочетаний.',columns:6,colors:[['','#06E3BE'],['','#49CFB1'],['','#61BBA5'],['','#70A798'],['','#7A948C'],['','#808080']]},
{title:'Тёмные оттенки',description:'Глубокие оттенки для фонов, hover-состояний и контрастных блоков.',columns:6,colors:[['','#06E3BE'],['','#1DB195'],['','#21826D'],['','#1E5548'],['','#162C26'],['','#000000']]}]},
{id:'neutral',name:'BIZON Neutral',description:'Индустриальная база бренда: фон, типографика, поверхности и служебные элементы.',familyColor:'#838383',sections:[
{title:'Основные оттенки',description:'Нейтральная шкала от почти белого до глубокого графита.',columns:5,colors:[['50','#F5F5F5'],['100','#E9E9E9'],['200','#CFCFCF'],['300','#B5B5B5'],['400','#9C9C9C'],['500','#838383'],['600','#696969'],['700','#505050'],['800','#363636',true],['900','#1C1C1C']]},
{title:'Светлые оттенки',description:'Светлая нейтральная шкала для текста, разделителей и спокойных поверхностей.',columns:6,colors:[['','#363636'],['','#5A5A5A'],['','#808080'],['','#A8A8A8'],['','#D3D3D3'],['','#FFFFFF']]},
{title:'Серые оттенки',description:'Рабочие серые оттенки для компонентов интерфейса.',columns:6,colors:[['','#363636'],['','#444444'],['','#525252'],['','#616161'],['','#707070'],['','#808080']]},
{title:'Тёмные оттенки',description:'Глубокие фоновые оттенки для тёмной темы BIZON.',columns:6,colors:[['','#363636'],['','#2C2C2C'],['','#232323'],['','#1A1A1A'],['','#101010'],['','#000000']]}]}
];
const root=document.getElementById('paletteRoot'),copyFormat=document.getElementById('copyFormat'),toast=document.getElementById('toast'),toastDot=document.getElementById('toastDot'),toastValue=document.getElementById('toastValue');let toastTimer;
function hexToRgb(hex){const v=parseInt(hex.slice(1),16);return{r:(v>>16)&255,g:(v>>8)&255,b:v&255}}
function textColor(hex){const{r,g,b}=hexToRgb(hex);return (r*299+g*587+b*114)/1000>155?'#171717':'#FFFFFF'}
function variableName(f,t,i){return `--bizon-${f}-${t||i+1}`}
function copyValue(f,t,h,i){if(copyFormat.value==='rgb'){const{r,g,b}=hexToRgb(h);return `rgb(${r}, ${g}, ${b})`}if(copyFormat.value==='variable')return `var(${variableName(f,t,i)})`;return h}
async function copyColor(f,t,h,i){const value=copyValue(f,t,h,i);try{await navigator.clipboard.writeText(value)}catch{const x=document.createElement('textarea');x.value=value;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}clearTimeout(toastTimer);toastValue.textContent=value;toastDot.style.setProperty('--toast-color',h);toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)}
paletteFamilies.forEach((family,familyIndex)=>{const familyEl=document.createElement('section');familyEl.className='palette-family';familyEl.style.setProperty('--family',family.familyColor);familyEl.innerHTML=`<div class="family-head"><span class="family-dot"></span><div><h2>${family.name}</h2><span>${family.description}</span></div></div>`;family.sections.forEach(section=>{const sectionEl=document.createElement('section');sectionEl.className='palette-section';sectionEl.innerHTML=`<div class="section-copy"><h3>${section.title}</h3><p>${section.description}</p></div><div class="swatch-grid${section.columns===6?' six':''}"></div>`;const grid=sectionEl.querySelector('.swatch-grid');section.colors.forEach(([tone,hex,recommended],index)=>{const swatch=document.createElement('button');swatch.type='button';swatch.className='swatch';swatch.style.setProperty('--color',hex);swatch.style.setProperty('--ink',textColor(hex));swatch.innerHTML=`${recommended?'<span class="recommended">★</span>':''}<span class="swatch-inner">${tone?`<span class="tone">${tone}</span>`:''}<span class="hex">${hex}</span></span><span class="copy-label">Копировать</span>`;swatch.addEventListener('click',()=>copyColor(family.id,tone,hex,index));grid.appendChild(swatch)});familyEl.appendChild(sectionEl)});root.appendChild(familyEl);if(familyIndex<paletteFamilies.length-1){const d=document.createElement('hr');d.className='divider';root.appendChild(d)}});
</script>
</body>
</html>
